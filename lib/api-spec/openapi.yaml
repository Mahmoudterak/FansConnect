openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Workspace billing catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /plans:
    get:
      operationId: listPlans
      tags: [billing]
      summary: List workspace plans
      description: Returns the AED monthly plan catalog available to a workspace.
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlanCatalog:
      type: object
      properties:
        currency:
          type: string
          example: AED
        billingInterval:
          type: string
          example: MONTHLY
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
      required:
        - currency
        - billingInterval
        - plans
    Plan:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        currency:
          type: string
        billingInterval:
          type: string
        amount:
          type: integer
        description:
          type: string
        limits:
          type: object
          additionalProperties:
            type: integer
        features:
          type: array
          items:
            type: string
      required:
        - code
        - name
        - currency
        - billingInterval
        - amount
        - description
        - limits
        - features

